name: Build

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Build ${{ matrix.target }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-web
            spec: packaging/dji-color-web.spec
            artifact: dji-color-web-windows-x64
          - os: macos-14
            target: macos-web-arm64
            spec: packaging/dji-color-web.spec
            artifact: dji-color-web-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e ".[web,dev]" pyinstaller

      - name: Test
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q tests

      - name: Build artifact
        run: pyinstaller --clean --noconfirm ${{ matrix.spec }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
