name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "要发布的 tag，例如 v2.0.0"
        required: true
        type: string
      prerelease:
        description: "是否标记为预发布版本"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            web_path: dist/dji-color-web.exe
            web_zip: dji-color-web-windows-x64.zip
          - os: macos-14
            platform: macos-arm64
            web_path: dist/dji-color-web
            web_zip: dji-color-web-macos-arm64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install -e ".[web,dev]" pyinstaller

      - name: Test
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q tests

      - name: Build Web desktop app
        run: pyinstaller --clean --noconfirm packaging/dji-color-web.spec

      - name: Mark macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: chmod +x "${{ matrix.web_path }}"

      - name: Package Windows assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "${{ matrix.web_path }}" -DestinationPath "release/${{ matrix.web_zip }}" -Force

      - name: Package macOS assets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release
          zip -j "release/${{ matrix.web_zip }}" "${{ matrix.web_path }}"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/*.zip

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag_name }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd release
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: DJI Color Classifier ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(steps.release_tag.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            release/dji-color-web-windows-x64.zip
            release/dji-color-web-macos-arm64.zip
            release/SHA256SUMS.txt
