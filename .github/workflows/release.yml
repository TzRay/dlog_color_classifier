name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "要发布的 tag，例如 v1.0.0。手动触发时必须已存在或由本流程创建。"
        required: true
        type: string
      prerelease:
        description: "是否标记为预发布版本"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executables
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag_name }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install -e ".[gui,dev]" pyinstaller

      - name: Test
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Build CLI exe
        run: pyinstaller --clean --noconfirm packaging/dji-color-cli.spec

      - name: Build GUI exe
        run: pyinstaller --clean --noconfirm packaging/dji-color-gui.spec

      - name: Smoke test CLI exe
        shell: pwsh
        run: .\dist\dji-color.exe version

      - name: Smoke test GUI exe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $process = Start-Process -FilePath ".\dist\dji-color-gui.exe" -ArgumentList "--smoke" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            throw "GUI smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Package release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path .\dist\dji-color.exe -DestinationPath .\release\dji-color-cli-windows-x64.zip -Force
          Compress-Archive -Path .\dist\dji-color-gui.exe -DestinationPath .\release\dji-color-gui-windows-x64.zip -Force
          Get-FileHash .\release\*.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Path .\release\SHA256SUMS.txt -Encoding UTF8

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: DJI Color Classifier ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(steps.release_tag.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            release/dji-color-cli-windows-x64.zip
            release/dji-color-gui-windows-x64.zip
            release/SHA256SUMS.txt
