<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>DJI Color Desk</title>
    <style>
      :root { --bg: #f7f4f1; --surface: #fff; --ink: #25201e; --muted: #766d68; --line: #e7dfda; --accent: #ba443a; --accent-dark: #96342d; --mint: #edf6f0; --success: #387353; --warning: #9a6725; --danger: #b13f36; }
      * { box-sizing: border-box; }
      body { min-width: 320px; margin: 0; color: var(--ink); background: var(--bg); font: 14px/1.5 system-ui, -apple-system, "Microsoft YaHei", sans-serif; }
      button, input, select { font: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .58; }
      .app { width: min(1440px, calc(100% - 40px)); margin: 0 auto; padding-bottom: 40px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 74px; border-bottom: 1px solid var(--line); }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .04em; }
      .brand-mark { display: grid; width: 31px; height: 31px; place-items: center; border-radius: 8px; color: #fff; background: var(--accent); font-size: 12px; }
      .top-actions { display: flex; align-items: center; gap: 10px; }
      .connection { color: var(--muted); font-size: 12px; }
      .connection-dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: #a99e98; }
      .connection.connected .connection-dot { background: var(--success); }
      .button-primary, .button-secondary, .text-button { border: 0; border-radius: 8px; font-weight: 700; }
      .button-primary { padding: 11px 16px; color: #fff; background: var(--accent); }
      .button-primary:hover:not(:disabled) { background: var(--accent-dark); }
      .button-secondary { padding: 9px 13px; color: var(--ink); background: #fff; border: 1px solid var(--line); }
      .text-button { padding: 5px 0; color: var(--accent-dark); background: transparent; }
      .hero { display: flex; align-items: end; justify-content: space-between; gap: 20px; padding: 36px 0 22px; }
      h1, h2, p { margin: 0; }
      h1 { font-size: clamp(26px, 4vw, 34px); line-height: 1.2; }
      .hero-copy, .section-copy { margin-top: 7px; color: var(--muted); }
      .folder-bar, .surface { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
      .folder-bar { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 16px 18px; }
      .folder-label, .section-kicker { color: var(--muted); font-size: 12px; }
      .folder-path { overflow: hidden; margin-top: 2px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
      .folder-detail { margin-top: 2px; color: var(--muted); font-size: 12px; }
      .folder-actions { display: flex; flex-shrink: 0; align-items: center; gap: 15px; }
      .summary-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin: 18px 0; }
      .summary-card { padding: 14px; text-align: left; border: 1px solid var(--line); border-radius: 12px; color: var(--ink); background: var(--surface); }
      .summary-card.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(186, 68, 58, .1); }
      .summary-value { margin-top: 4px; font-size: 25px; font-weight: 800; }
      .summary-note { color: var(--muted); font-size: 12px; }
      .workspace { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(310px, .8fr); gap: 18px; }
      .surface { padding: 20px; }
      .section-head, .result-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
      h2 { font-size: 18px; }
      .filters { display: flex; flex-wrap: wrap; gap: 7px; margin: 18px 0 12px; }
      .filter-pill { padding: 6px 10px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); background: #fff; }
      .filter-pill.active { border-color: var(--accent); color: var(--accent-dark); background: #fff5f3; }
      .search { width: 220px; max-width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
      .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
      table { width: 100%; min-width: 630px; border-collapse: collapse; }
      th, td { padding: 11px 12px; text-align: left; border-bottom: 1px solid var(--line); }
      th { color: var(--muted); background: #fcfaf9; font-size: 12px; }
      tr:last-child td { border-bottom: 0; }
      .status { display: inline-block; padding: 3px 7px; border-radius: 99px; font-size: 12px; font-weight: 700; }
      .status.ready { color: var(--success); background: var(--mint); }
      .status.review { color: var(--warning); background: #fff6e8; }
      .status.error { color: var(--danger); background: #fff0ef; }
      .mode-dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: #81756e; }
      .mode-dot.dlog { background: #6d8b60; } .mode-dot.dlog2 { background: #6685aa; } .mode-dot.rec709 { background: #bc8a41; } .mode-dot.hlg { background: #9b70a5; }
      .table-footer { margin-top: 10px; color: var(--muted); font-size: 12px; }
      .organize-copy { margin: 8px 0 16px; color: var(--muted); font-size: 13px; }
      .mode-options { display: grid; gap: 9px; }
      .mode-option { padding: 11px; text-align: left; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
      .mode-option.selected { border-color: var(--accent); background: #fff8f7; }
      .mode-option small { display: block; margin-top: 2px; color: var(--muted); }
      .settings-list { display: grid; gap: 12px; margin: 18px 0; }
      .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .setting-row label { color: var(--muted); }
      .setting-row select { max-width: 155px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: #fff; }
      .checkbox { display: flex; align-items: center; gap: 7px; color: var(--muted); }
      .organize-note { margin-top: 12px; color: var(--muted); font-size: 12px; }
      .result-panel { margin-top: 18px; }
      .result-panel[hidden] { display: none; }
      .outcome-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
      .outcome-stat { padding: 11px; border-radius: 9px; background: #faf7f5; }
      .outcome-stat strong { display: block; font-size: 21px; }
      .failure-list { margin: 0; padding-left: 18px; color: var(--danger); }
      .toast { position: fixed; right: 20px; bottom: 20px; z-index: 2; max-width: min(420px, calc(100vw - 40px)); padding: 12px 15px; border-radius: 10px; color: #fff; background: #34302e; box-shadow: 0 8px 26px rgba(0,0,0,.18); opacity: 0; transform: translateY(12px); pointer-events: none; transition: .2s; }
      .toast.visible { opacity: 1; transform: translateY(0); }
      .toast.error { background: var(--danger); }
      @media (max-width: 980px) { .summary-grid { grid-template-columns: repeat(3, 1fr); } .workspace { grid-template-columns: 1fr; } }
      @media (max-width: 640px) { .app { width: min(100% - 24px, 1440px); } .topbar, .hero, .folder-bar, .result-head { align-items: flex-start; flex-direction: column; } .topbar { padding: 12px 0; } .hero { padding-top: 26px; } .folder-actions { flex-wrap: wrap; } .summary-grid { grid-template-columns: repeat(2, 1fr); } .search { width: 100%; } .outcome-summary { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">dji</span><span>COLOR DESK</span></div>
        <div class="top-actions"><span class="connection" id="connectionStatus"><span class="connection-dot"></span>等待本地服务</span></div>
      </header>

      <main>
        <section class="hero" aria-labelledby="pageTitle">
          <div><h1 id="pageTitle">识别与整理素材</h1><p class="hero-copy">选择素材文件夹后自动识别；确认过的色彩模式可直接整理。</p></div>
          <button class="button-primary" id="chooseFolder" type="button">选择素材文件夹</button>
        </section>

        <section class="folder-bar" aria-label="当前目录">
          <div><div class="folder-label">当前扫描目录</div><div class="folder-path" id="folderPath">尚未选择素材文件夹</div><div class="folder-detail" id="folderDetail">选择目录后自动开始识别</div></div>
          <div class="folder-actions"><button class="text-button" id="cancelTask" type="button" hidden>取消任务</button><button class="text-button" id="rescanFolder" type="button">重新识别</button><button class="text-button" id="changeFolder" type="button">换目录</button></div>
        </section>

        <section class="summary-grid" aria-label="识别概览统计">
          <button class="summary-card active" data-filter="all" type="button"><span class="section-kicker">全部视频</span><div class="summary-value">0</div><span class="summary-note">本次扫描发现</span></button>
          <button class="summary-card" data-filter="dlog" type="button"><span class="section-kicker">D-Log</span><div class="summary-value">0</div><span class="summary-note">可自动整理</span></button>
          <button class="summary-card" data-filter="dlog2" type="button"><span class="section-kicker">D-Log2</span><div class="summary-value">0</div><span class="summary-note">可自动整理</span></button>
          <button class="summary-card" data-filter="rec709" type="button"><span class="section-kicker">普通 709</span><div class="summary-value">0</div><span class="summary-note">可自动整理</span></button>
          <button class="summary-card" data-filter="rec2100_hlg" type="button"><span class="section-kicker">HLG HDR</span><div class="summary-value">0</div><span class="summary-note">可自动整理</span></button>
          <button class="summary-card" data-filter="unknown" type="button"><span class="section-kicker">未处理</span><div class="summary-value">0</div><span class="summary-note">不会自动整理</span></button>
        </section>

        <div class="workspace">
          <section class="surface" aria-labelledby="resultsTitle">
            <div class="result-head"><div><h2 id="resultsTitle">识别结果</h2><p class="section-copy" id="resultsCopy">选择素材文件夹后，识别结果会显示在这里。</p></div><input class="search" id="searchInput" type="search" placeholder="搜索文件名或路径" /></div>
            <div class="filters" aria-label="筛选识别结果">
              <button class="filter-pill active" data-filter="all" type="button">全部 <span>0</span></button>
              <button class="filter-pill" data-filter="dlog" type="button">D-Log <span>0</span></button>
              <button class="filter-pill" data-filter="dlog2" type="button">D-Log2 <span>0</span></button>
              <button class="filter-pill" data-filter="rec709" type="button">709 <span>0</span></button>
              <button class="filter-pill" data-filter="rec2100_hlg" type="button">HLG <span>0</span></button>
              <button class="filter-pill" data-filter="unknown" type="button">未处理 <span>0</span></button>
            </div>
            <div class="table-wrap"><table><thead><tr><th>状态</th><th>文件名</th><th>色彩模式</th><th>所在文件夹</th><th>识别依据</th></tr></thead><tbody id="resultBody"></tbody></table></div>
            <div class="table-footer" id="tableCount">尚未扫描文件夹</div>
          </section>

          <aside class="surface" aria-labelledby="organizeTitle">
            <h2 id="organizeTitle">整理设置</h2><p class="organize-copy">直接执行，不生成预演、操作记录或可撤销文件。</p>
            <div class="mode-options">
              <button class="mode-option selected" data-mode="copy" type="button"><strong>复制到分类文件夹</strong><small>保留原片，推荐首次使用</small></button>
              <button class="mode-option" data-mode="move" type="button"><strong>移动到分类文件夹</strong><small>将素材移动至分类目录</small></button>
              <button class="mode-option" data-mode="prefix" type="button"><strong>添加文件名前缀</strong><small>为已识别素材添加模式前缀</small></button>
            </div>
            <div class="settings-list">
              <div class="setting-row"><label for="conflictPolicy">发生同名冲突时</label><select id="conflictPolicy"><option value="suffix" selected>自动追加序号</option><option value="skip">跳过冲突</option><option value="error">标记为失败</option></select></div>
              <label class="checkbox"><input id="sidecarToggle" type="checkbox" checked />同步处理同名伴随文件</label>
              <label class="checkbox"><input id="recursiveToggle" type="checkbox" checked />扫描子文件夹</label>
            </div>
            <button class="button-primary" id="executeOrganize" type="button" disabled>执行整理</button>
            <button class="text-button" id="exportReport" type="button">导出识别报告（CSV / JSON）</button>
            <p class="organize-note">执行时会再次检查文件和目标路径。无法确认、证据冲突和识别失败的文件不会自动整理。</p>
          </aside>
        </div>

        <section class="surface result-panel" id="outcomePanel" hidden aria-labelledby="outcomeTitle">
          <div class="section-head"><div><h2 id="outcomeTitle">执行结果</h2><p class="section-copy" id="outcomeCopy"></p></div></div>
          <div class="outcome-summary"><div class="outcome-stat"><span class="section-kicker">成功</span><strong id="successCount">0</strong></div><div class="outcome-stat"><span class="section-kicker">跳过</span><strong id="skippedCount">0</strong></div><div class="outcome-stat"><span class="section-kicker">失败</span><strong id="failedCount">0</strong></div></div>
          <ul class="failure-list" id="failureList"></ul>
        </section>
      </main>
    </div>
    <div class="toast" id="toast"><strong id="toastTitle"></strong><div id="toastCopy"></div></div>
    <script src="app.js"></script>
  </body>
</html>
